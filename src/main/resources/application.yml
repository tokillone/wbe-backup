server:
  port: 8080  # 服务端口
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wbe?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

wbe:
  storage:
    # 开发环境默认沿用原目录；Docker 中设置 WBE_UPLOAD_DIR=/data/wbe/uploads。
    upload-dir: ${WBE_UPLOAD_DIR:${user.dir}/uploads/data}
    max-file-size: 50MB
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

mybatis:
  configuration:
    map-underscore-to-camel-case: true

mail:
  host: ${MAIL_HOST:smtp.126.com}
  port: ${MAIL_PORT:465}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  default-encoding: UTF-8
  properties:
    mail:
      debug: false                     # 调试时可以改为 true
      smtp:
        auth: true
        starttls:
          enable: false                # 使用 SSL 时关闭 starttls
        ssl:
          enable: true
          required: true

logging:
  level:
    com.licong.webbackup: debug  # 项目包名日志级别
