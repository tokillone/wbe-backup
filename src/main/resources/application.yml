server:
  port: 8080  # 服务端口

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wbe?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    map-underscore-to-camel-case: true

mail:
  host: ${MAIL_HOST:smtp.126.com}
  port: ${MAIL_PORT:465}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  default-encoding: UTF-8
  properties:
    mail:
      debug: false                     # 调试时可以改为 true
      smtp:
        auth: true
        starttls:
          enable: false                # 使用 SSL 时关闭 starttls
        ssl:
          enable: true
          required: true

logging:
  level:
    com.licong.webbackup: debug  # 项目包名日志级别
